<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自行车中级 · 必背185 · 刷题系统</title>
<style>
:root{
  --bg:#f2f4f7; --card:#ffffff; --ink:#151a20; --sub:#5d6673; --line:#e3e7ee;
  --brand:#2f6df6; --brand-soft:#eaf0ff; --ok:#16a34a; --ok-soft:#e8f7ee;
  --bad:#e02424; --bad-soft:#fdeaea; --warn:#d97706; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
html[data-theme="dark"]{
  --bg:#0e1116; --card:#171c23; --ink:#e8ecf2; --sub:#98a2b3; --line:#262d36;
  --brand:#5b8cff; --brand-soft:#1b2740; --ok:#34d399; --ok-soft:#12281f;
  --bad:#f87171; --bad-soft:#2a1616; --warn:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:40px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
select,input{font-family:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
select:focus,input:focus{border-color:var(--brand)}
::selection{background:var(--brand-soft)}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#7aa2ff);display:grid;place-items:center;font-size:19px;flex:0 0 auto;box-shadow:var(--shadow)}
.ttl{font-size:17px;font-weight:700;letter-spacing:.2px}
.sub{font-size:12px;color:var(--sub);margin-top:-2px}
.hd .spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:16px}
/* tabs */
nav.tabs{display:flex;gap:6px;padding:0 0 8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 15px;border-radius:10px;font-size:14px;font-weight:600;color:var(--sub);border:1px solid transparent;transition:.15s}
.tab:hover{color:var(--ink);background:var(--card)}
.tab.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 35%,transparent)}
.tab .cnt{font-size:11px;opacity:.8;margin-left:2px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin:14px 0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 0}
.bar .spacer{flex:1}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:600;white-space:nowrap}
.chip.gray{background:var(--bg);color:var(--sub)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:12px}
.qtext{font-size:19px;line-height:1.55;font-weight:650;letter-spacing:.1px;margin:0 0 16px}
.qtext.small{font-size:17px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);transition:.13s;font-size:15.5px;line-height:1.5}
.opt:hover:not(:disabled){border-color:color-mix(in srgb,var(--brand) 50%,var(--line));background:color-mix(in srgb,var(--brand-soft) 55%,var(--card))}
.opt .k{flex:0 0 auto;width:23px;height:23px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--sub);margin-top:1px}
.opt .t{flex:1;padding-top:1px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);border-color:var(--brand);color:#fff}
.exp{margin-top:14px;padding:13px 15px;border-radius:12px;background:var(--bg);border-left:3px solid var(--brand);font-size:14.5px;color:var(--ink);line-height:1.65}
.exp b{color:var(--brand);font-weight:700}
.exp .lbl{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;letter-spacing:.3px}

/* buttons */
.btn{padding:11px 18px;border-radius:11px;font-size:15px;font-weight:650;background:var(--card);border:1px solid var(--line);transition:.13s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 13px;font-size:13.5px;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.row.end{justify-content:space-between}

/* progress */
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 16px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#7aa2ff);border-radius:99px;transition:width .25s}
.mini{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}

/* start panel */
.hero{text-align:center;padding:26px 20px}
.hero .big{font-size:26px;font-weight:750;letter-spacing:.5px;margin:6px 0 4px}
.hero .desc{color:var(--sub);font-size:14px;margin-bottom:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin-top:6px}
.field label{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:6px}
.field select,.field input{width:100%}
.mode-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0 4px}
.mc{border:1px solid var(--line);border-radius:13px;padding:14px;text-align:left;background:var(--card);transition:.13s}
.mc:hover{border-color:var(--brand);transform:translateY(-1px)}
.mc .t{font-weight:700;font-size:15px;margin-bottom:2px}
.mc .d{font-size:12.5px;color:var(--sub);line-height:1.5}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
.st .n{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.25}
.st .l{font-size:11.5px;color:var(--sub)}
.st.ok .n{color:var(--ok)} .st.bad .n{color:var(--bad)} .st.br .n{color:var(--brand)}

/* palette */
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:14px}
.pal button{height:32px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--bg);color:var(--sub);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pal button.done{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.pal button.cur{outline:2px solid var(--brand);outline-offset:1px}
.pal button.flag{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}

/* list */
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.item .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:8px}
.item .qt{font-size:15.5px;font-weight:600;line-height:1.55;margin-bottom:10px}
.ansline{font-size:14px;line-height:1.7}
.ansline .lab{color:var(--sub);font-size:12.5px;margin-right:4px}
.ansline .v-ok{color:var(--ok);font-weight:650}
.ansline .v-bad{color:var(--bad);font-weight:650}
.empty{text-align:center;padding:48px 20px;color:var(--sub)}
.empty .e{font-size:40px;margin-bottom:10px;opacity:.7}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 18px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
.rslt{text-align:center;padding:10px 0 4px}
.rslt .big{font-size:44px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.rslt .txt{color:var(--sub);font-size:14px;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--sub)}
.kv .v{font-weight:650;font-variant-numeric:tabular-nums}
@media (max-width:600px){
  .qtext{font-size:17.5px}
  .card{padding:16px;border-radius:14px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.mode-cards{grid-template-columns:1fr}
  .hd{padding:12px 0 8px}
}

/* ===== 复习卡片（品牌 / 衫色）===== */
#drillSec{scroll-margin-top:76px}
body{padding-bottom:60px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow)}
.bc.it{border-left-color:#0f9d58}.bc.us{border-left-color:#1d4ed8}.bc.cn{border-left-color:#c1121f}
.bc.tw{border-left-color:#0891b2}.bc.jp{border-left-color:#dc2626}.bc.de{border-left-color:#8b5cf6}
.bc.ch{border-left-color:#e11d48}.bc.fr{border-left-color:#3b6ef0}.bc.es{border-left-color:#f59e0b}
.bc.ca{border-left-color:#db2777}
.bc.cn{grid-column:span 2}
.bc h4{margin:0 0 3px;font-size:14.5px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.bc h4 small{font-size:11px;color:var(--sub);font-weight:600}
.bc .hk{font-size:12.5px;color:var(--sub);margin:0 0 9px;line-height:1.55}
.bc .hk b{color:var(--ink)}
.blist div{display:flex;gap:7px;font-size:12.8px;line-height:1.55;margin-bottom:3px}
.blist i{font-style:normal;font-weight:650;flex:0 0 auto;min-width:78px}
.blist span{color:var(--sub)}
.bnote{font-size:11.5px;color:var(--sub);margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;color:var(--sub);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{color:var(--sub);font-size:12.3px;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.14)}
.tag{font-size:10px;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:4px;vertical-align:1px}
.tag.k{background:var(--brand-soft);color:var(--brand)}
.tag.b{background:var(--bg);color:var(--sub)}
.pitbox{background:color-mix(in srgb,var(--bad-soft) 65%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 22%,var(--line));border-radius:12px;padding:3px 14px}
.pp{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed color-mix(in srgb,var(--bad) 18%,var(--line));font-size:12.8px;line-height:1.55}
.pp:last-child{border-bottom:none}
.pp .xx{color:var(--bad);font-weight:800;flex:0 0 auto}
.mantra2{background:#111827;color:#e5edf8;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.9}
html[data-theme="dark"] .mantra2{background:#0b1220;border:1px solid var(--line)}
.mantra2 b{color:var(--warn);margin-right:6px}
.mantra2 .sm{color:#94a3b8;font-size:11.5px}
.sft{font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer;user-select:none;transition:.12s}
.sft:hover{border-color:var(--sub)}
.sft b{color:transparent;background:var(--line);border-radius:4px;padding:0 5px;font-size:11px;margin-left:5px}
.sft.on b{color:#fff;background:var(--ok)}
.selftest{display:flex;flex-wrap:wrap;gap:6px}
.flow2 .stp{display:flex;gap:11px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
.flow2 .stp:last-child{border-bottom:none}
.flow2 .n2{flex:0 0 auto;width:19px;height:19px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.flow2 .k2{display:block;font-size:11.5px;color:var(--sub);margin-top:2px}
@media(max-width:600px){.cgrid{grid-template-columns:1fr}.bc.cn{grid-column:span 1}}
.bk{font-size:13px;line-height:1.6;padding:6px 0;border-bottom:1px dashed var(--line)}
.bk:last-child{border-bottom:none}
.bk b{color:var(--brand)}
</style>
</head>

</header>

<main class="wrap" id="app"></main>

/* ---------------- 口令门 ---------------- */
const PKEY='bike185_data';
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:PAYLOAD.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function tryUnlock(pw){
  const key=await deriveKey(pw,b64d(PAYLOAD.s));
  const buf=b64d(PAYLOAD.d);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
function mount(r){DATA=r.q;CARDS=r.c;boot()}
function renderLock(err){
  document.getElementById('hdSub').textContent='内部资料 · 需访问口令';
  document.getElementById('app').innerHTML=`
  <div class="card" style="max-width:430px;margin:48px auto 0;text-align:center;padding:30px 22px">
    <div style="font-size:38px;line-height:1.1">🔒</div>
    <div style="font-size:20px;font-weight:750;margin:12px 0 4px">内部资料</div>
    <div class="mini">输入访问口令后即可开始背题 · 手机电脑通用</div>
    <input id="pw" type="password" placeholder="访问口令" autocomplete="off"
      style="width:100%;margin:20px 0 10px;text-align:center;letter-spacing:3px;font-size:17px;padding:12px">
    <button class="btn primary" id="pwGo" style="width:100%">进入</button>
    <div id="pwErr" class="mini" style="color:var(--bad);height:20px;margin-top:10px">${err||''}</div>
  </div>`;
  const inp=document.getElementById('pw'), go=document.getElementById('pwGo');
  const submit=async()=>{
    const v=inp.value.trim();
    if(!v||go.disabled)return;
    go.disabled=true;go.textContent='验证中…';
    try{
      const r=await tryUnlock(v);
      try{localStorage.setItem(PKEY,JSON.stringify(r))}catch(e){}
      mount(r);
    }catch(e){ renderLock('口令不对，请再试一次'); setTimeout(()=>{const n=document.getElementById('pw');if(n)n.focus()},50); }
  };
  go.onclick=submit;
  inp.onkeydown=e=>{if(e.key==='Enter')submit()};
  inp.focus();
}
function gate(){
  let cached=null;
  try{cached=localStorage.getItem(PKEY)}catch(e){}
  if(cached){try{mount(JSON.parse(cached));return}catch(e){}}
  renderLock('');
}

function boot(){
/* ---------------- 存储 ---------------- */
const KEY='bike185_v1';
const DEF={v:1,mastered:{},wrong:{},examHist:[]};
let DB=(()=>{try{const r=JSON.parse(localStorage.getItem(KEY));return r&&r.v===1?Object.assign({},DEF,r):structuredClone(DEF)}catch(e){return structuredClone(DEF)}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};

/* ---------------- 工具 ---------------- */
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SECTIONS=[...new Set(DATA.map(q=>q.s))];
const byId=id=>DATA.find(q=>q.id===id);
const shuffle=a=>{const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
const wrongIds=()=>Object.keys(DB.wrong).map(Number).filter(id=>byId(id));
const fmtTime=s=>{const m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')};
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1600)}
function refreshHeader(){
  const m=Object.keys(DB.mastered).length, w=wrongIds().length;
  document.getElementById('hdSub').textContent=`共 ${DATA.length} 题 · 已掌握 ${m} · 错题 ${w} · v5`;
  document.getElementById('wrongCnt').textContent=w?` (${w})`:'';
}
function markWrong(id){const o=DB.wrong[id]||{c:0,t:0};o.c++;o.t=Date.now();DB.wrong[id]=o;save();refreshHeader()}
function markRight(id){if(DB.wrong[id]){delete DB.wrong[id];save();refreshHeader()}}

/* ---------------- 状态 ---------------- */
let TAB='memo';
const M={i:0,reveal:true,sec:'',kw:'',shuffle:false,list:[]};
const MD={qid:null,answered:false,chosen:null,right:0,wrong:0,streak:0};
const P={running:false,pool:[],i:0,chosen:null,answered:false,right:0,wrong:0,sec:'',order:'seq',onlyWrong:false,done:false};
const E={running:false,pool:[],i:0,pick:{},left:0,timer:null,total:0,sec:'',n:20,submitted:false};

function filterPool(sec,kw){
  return DATA.filter(q=>(!sec||q.s===sec)&&(!kw||q.q.includes(kw)||q.p.some(p=>p[1].includes(kw))));
}

/* ---------------- 速记模式 ---------------- */
function buildMemo(){M.list=filterPool(M.sec,M.kw);if(M.shuffle)M.list=shuffle(M.list);M.i=0;M.reveal=true}
function renderMemo(){
  if(!M.list.length)buildMemo();
  const q=M.list[M.i];
  if(!q){app.innerHTML=`<div class="card empty"><div class="e">🔍</div>没有匹配的题目</div>`;return}
  if(MD.qid!==q.id){MD.qid=q.id;MD.answered=false;MD.chosen=null}
  const mastered=!!DB.mastered[q.id];
  app.innerHTML=`
  <div class="bar">
    <select id="mSec"><option value="">全部题库 (${DATA.length})</option>${SECTIONS.map(s=>`<option value="${esc(s)}"${M.sec===s?' selected':''}>${esc(s)} (${DATA.filter(x=>x.s===s).length})</option>`).join('')}</select>
    <input id="mKw" placeholder="搜索关键词…" value="${esc(M.kw)}" style="width:150px;flex:1;min-width:110px">
    <button class="btn sm ghost" id="mSh">${M.shuffle?'🔀 随机中':'↕ 顺序'}</button>
  </div>
  <div class="prog"><i style="width:${(M.i+1)/M.list.length*100}%"></i></div>
  <div class="card">
    <div class="qmeta">
      <span class="chip">${M.i+1} / ${M.list.length}</span>
      <span class="chip gray">${q.t}</span>
      <span class="chip gray">原第 ${q.o} 题</span>
      ${mastered?'<span class="chip ok">已掌握</span>':''}
      <button class="chip" id="mJumpTop" style="margin-left:auto;background:var(--brand);color:#fff;border:none;cursor:pointer">练一练 ↓</button>
    </div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">
      ${q.p.map(([k,t,ok])=>`<div class="opt ${M.reveal?(ok?'ok':'dim'):''}"><span class="k">${k}</span><span class="t">${esc(t)}</span></div>`).join('')}
    </div>
    ${M.reveal?`<div class="exp"><span class="lbl">正确答案 ${q.a} · 解析</span>${esc(q.e)}</div>`:''}
    <div class="row end">
      <button class="btn" id="mPrev" ${M.i===0?'disabled':''}>← 上一题</button>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" id="mMaster">${mastered?'取消掌握':'✓ 已掌握'}</button>
        <button class="btn primary" id="mReveal">${M.reveal?'隐藏答案':'显示答案'}</button>
        <button class="btn" id="mNext" ${M.i===M.list.length-1?'disabled':''}>下一题 →</button>
      </div>
    </div>
    <button class="btn ghost" id="mJump" style="width:100%;margin-top:12px;border-style:dashed;color:var(--brand)">↓ 到下面练这道题</button>
  </div>
  <div class="card" id="drillSec" style="border-style:dashed;border-color:color-mix(in srgb,var(--brand) 35%,var(--line))">
    <div class="qmeta" style="margin-bottom:11px">
      <span class="chip">这道题 · 练一练</span>
      <span class="mini">点选项作答，答错自动进错题本</span>
    </div>
    <div class="opts" id="mDrill">
      ${q.p.map(([k,t])=>{
        let cls='';
        if(MD.answered){ if(k===q.a)cls='ok'; else if(MD.chosen===k)cls='bad'; else cls='dim'; }
        return `<button class="opt ${cls}" data-k="${k}" ${MD.answered?'disabled':''}><span class="k">${k}</span><span class="t">${esc(t)}</span></button>`;
      }).join('')}
    </div>
    <div class="row end" style="margin-top:12px">
      <span class="mini" id="mDrillMsg" style="font-weight:${MD.answered?'650':'400'};color:${MD.answered?(MD.chosen===q.a?'var(--ok)':'var(--bad)'):'var(--sub)'}">
        ${MD.answered?(MD.chosen===q.a?'✓ 答对了，下一题继续':'✗ 答错了 · 正确答案是 '+q.a):'↓ 先别看上面，直接从下面选'}
      </span>
      <span class="mini">本轮 对 ${MD.right} · 错 ${MD.wrong}${MD.streak>1?' · 连对 '+MD.streak:''}</span>
    </div>
  </div>
  <div class="mini" style="text-align:center">提示：← → 翻页 · 空格 隐藏/显示答案 · 1-4 在下方练习区作答</div>`;
  app.querySelectorAll('#mDrill .opt').forEach(b=>b.onclick=()=>ansDrill(b.dataset.k));
  document.getElementById('mSec').onchange=e=>{M.sec=e.target.value;buildMemo();renderMemo()};
  const kw=document.getElementById('mKw');
  kw.oninput=e=>{M.kw=e.target.value.trim();buildMemo();renderMemo();const n=document.getElementById('mKw');n.focus();n.setSelectionRange(n.value.length,n.value.length)};
  document.getElementById('mSh').onclick=()=>{M.shuffle=!M.shuffle;buildMemo();renderMemo()};
  document.getElementById('mPrev').onclick=()=>{if(M.i>0){M.i--;renderMemo()}};
  document.getElementById('mNext').onclick=()=>{if(M.i<M.list.length-1){M.i++;renderMemo()}};
  document.getElementById('mReveal').onclick=()=>{M.reveal=!M.reveal;renderMemo()};
  const jumpTo=()=>{const d=document.getElementById('drillSec');if(d)d.scrollIntoView({behavior:'smooth',block:'start'})};
  document.getElementById('mJump').onclick=jumpTo;
  document.getElementById('mJumpTop').onclick=jumpTo;
  document.getElementById('mMaster').onclick=()=>{
    if(DB.mastered[q.id]){delete DB.mastered[q.id];toast('已取消掌握')}
    else{DB.mastered[q.id]=1;toast('已标记掌握')}
    save();refreshHeader();renderMemo();
  };
}

function ansDrill(k){
  const q=M.list[M.i];
  if(!q||MD.answered)return;
  MD.answered=true;MD.chosen=k;
  if(k===q.a){MD.right++;MD.streak++;markRight(q.id)}
  else{MD.wrong++;MD.streak=0;markWrong(q.id)}
  const y=window.scrollY;
  renderMemo();
  window.scrollTo(0,y);
}

/* ---------------- 刷题模式 ---------------- */
function renderPracticeStart(){
  P.running=false;
  const w=wrongIds().length;
  app.innerHTML=`
  <div class="card hero">
    <div style="font-size:34px">🎯</div>
    <div class="big">刷题模式</div>
    <div class="desc">答完立即判分并给解析，答错自动进入错题本</div>
    <div class="grid2">
      <div class="field"><label>题库范围</label>
        <select id="pSec"><option value="">全部题库 (${DATA.length} 题)</option>${SECTIONS.map(s=>`<option value="${esc(s)}">${esc(s)} (${DATA.filter(x=>x.s===s).length})</option>`).join('')}</select></div>
      <div class="field"><label>出题顺序</label>
        <select id="pOrd"><option value="seq">按题号顺序</option><option value="shuffle">随机打乱</option></select></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:22px">
      <button class="btn primary" id="pGo" style="padding:12px 30px">开始刷题</button>
      ${w?`<button class="btn" id="pWrong">只刷错题 (${w})</button>`:''}
    </div>
  </div>
  <div class="stats">
    <div class="st br"><div class="n">${Object.keys(DB.mastered).length}</div><div class="l">已掌握</div></div>
    <div class="st bad"><div class="n">${w}</div><div class="l">错题待复习</div></div>
    <div class="st"><div class="n">${DATA.length-w-Object.keys(DB.mastered).length}</div><div class="l">未接触</div></div>
    <div class="st"><div class="n">${DB.examHist.length}</div><div class="l">考试次数</div></div>
  </div>`;
  document.getElementById('pGo').onclick=()=>{
    P.sec=document.getElementById('pSec').value;
    P.order=document.getElementById('pOrd').value;
    P.onlyWrong=false;
    let pool=filterPool(P.sec,'');
    if(P.order==='shuffle')pool=shuffle(pool);
    startPractice(pool);
  };
  const bw=document.getElementById('pWrong');
  if(bw)bw.onclick=()=>{P.onlyWrong=true;P.sec='';startPractice(shuffle(wrongIds().map(byId)))};
}
function startPractice(pool){
  if(!pool.length){toast('没有可刷的题目');return}
  Object.assign(P,{running:true,pool,i:0,chosen:null,answered:false,right:0,wrong:0,done:false});
  renderPractice();
}
function renderPractice(){
  if(P.done)return renderPracticeDone();
  const q=P.pool[P.i];
  if(!q)return renderPracticeDone();
  app.innerHTML=`
  <div class="bar">
    <span class="chip">第 ${P.i+1} / ${P.pool.length} 题</span>
    <span class="chip ok">✓ ${P.right}</span>
    <span class="chip bad">✗ ${P.wrong}</span>
    <div class="spacer"></div>
    <button class="btn sm ghost" id="pQuit">结束本轮</button>
  </div>
  <div class="prog"><i style="width:${(P.i+1)/P.pool.length*100}%"></i></div>
  <div class="card">
    <div class="qmeta"><span class="chip gray">${q.t}</span><span class="chip gray">${esc(q.s)}</span><span class="chip gray">原第 ${q.o} 题</span></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts" id="pOpts">
      ${q.p.map(([k,t,ok])=>{
        let cls='';
        if(P.answered){
          if(ok)cls='ok';
          else if(P.chosen===k)cls='bad';
          else cls='dim';
        }
        return `<button class="opt ${cls}" data-k="${k}" ${P.answered?'disabled':''}><span class="k">${k}</span><span class="t">${esc(t)}</span></button>`;
      }).join('')}
    </div>
    ${P.answered?`<div class="exp"><span class="lbl">正确答案 ${q.a} ${P.chosen===q.a?'· 回答正确 ✓':'· 你选了 '+P.chosen+' ✗'}</span>${esc(q.e)}</div>`:''}
    <div class="row end">
      <span class="mini">${P.answered?'':'点击选项作答，也可按 1-4'}</span>
      ${P.answered?`<button class="btn primary" id="pNext">${P.i===P.pool.length-1?'查看结果':'下一题 →'}</button>`:'<span></span>'}
    </div>
  </div>`;
  app.querySelectorAll('#pOpts .opt').forEach(b=>b.onclick=()=>answerPractice(b.dataset.k));
  const nx=document.getElementById('pNext');if(nx)nx.onclick=nextPractice;
  document.getElementById('pQuit').onclick=()=>{P.done=true;renderPracticeDone()};
}
function answerPractice(k){
  if(P.answered)return;
  const q=P.pool[P.i];
  P.chosen=k;P.answered=true;
  if(k===q.a){P.right++;markRight(q.id)}
  else{P.wrong++;markWrong(q.id)}
  renderPractice();
}
function nextPractice(){
  if(P.i<P.pool.length-1){P.i++;P.chosen=null;P.answered=false;renderPractice()}
  else{P.done=true;renderPracticeDone()}
}
function renderPracticeDone(){
  const tot=P.right+P.wrong, acc=tot?Math.round(P.right/tot*100):0;
  app.innerHTML=`
  <div class="card">
    <div class="rslt">
      <div class="big" style="color:${acc>=80?'var(--ok)':acc>=60?'var(--warn)':'var(--bad)'}">${acc}%</div>
      <div class="txt">本轮正确率 · 共作答 ${tot} 题</div>
    </div>
    <div style="margin-top:18px">
      <div class="kv"><span class="k">答对</span><span class="v" style="color:var(--ok)">${P.right}</span></div>
      <div class="kv"><span class="k">答错</span><span class="v" style="color:var(--bad)">${P.wrong}</span></div>
      <div class="kv"><span class="k">错题本累计</span><span class="v">${wrongIds().length} 题</span></div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn primary" id="pAgain">再来一轮</button>
      ${P.wrong?`<button class="btn" id="pToWrong">去错题复习</button>`:''}
      <button class="btn ghost" id="pHome">返回</button>
    </div>
  </div>`;
  document.getElementById('pAgain').onclick=()=>{P.done=false;P.i=0;P.right=0;P.wrong=0;P.chosen=null;P.answered=false;P.pool=P.order==='shuffle'?shuffle(P.pool):P.pool;renderPractice()};
  document.getElementById('pHome').onclick=()=>{P.running=false;renderPracticeStart()};
  const tw=document.getElementById('pToWrong');if(tw)tw.onclick=()=>switchTab('wrong');
}

/* ---------------- 考试模式 ---------------- */
function renderExamStart(){
  const h=DB.examHist.slice(-3).reverse();
  app.innerHTML=`
  <div class="card hero">
    <div style="font-size:34px">📝</div>
    <div class="big">考试模式</div>
    <div class="desc">限时作答，交卷后统一判分，中途不出答案</div>
    <div class="grid2">
      <div class="field"><label>题目数量</label>
        <select id="eN"><option value="20">20 题（约 15 分钟）</option><option value="50">50 题（约 37 分钟）</option><option value="185">全部 185 题（约 2 小时）</option></select></div>
      <div class="field"><label>题库范围</label>
        <select id="eSec"><option value="">全部题库</option>${SECTIONS.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div>
    </div>
    <div class="row" style="justify-content:center;margin-top:22px">
      <button class="btn primary" id="eGo" style="padding:12px 30px">开始考试</button>
    </div>
    <div class="mini" style="margin-top:12px">计时结束自动交卷 · 答错题目自动进入错题本</div>
  </div>
  ${h.length?`<div class="card"><div class="qmeta" style="margin-bottom:10px"><span class="chip">历史成绩</span></div>
    ${h.map(r=>`<div class="kv"><span class="k">${new Date(r.t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${r.n}题</span><span class="v" style="color:${r.acc>=80?'var(--ok)':r.acc>=60?'var(--warn)':'var(--bad)'}">${r.acc}% (${r.r}/${r.n})</span></div>`).join('')}
  </div>`:''}`;
  document.getElementById('eGo').onclick=()=>{
    const n=parseInt(document.getElementById('eN').value,10);
    const sec=document.getElementById('eSec').value;
    let pool=filterPool(sec,'');
    pool=shuffle(pool).slice(0,Math.min(n,pool.length));
    startExam(pool);
  };
}
function startExam(pool){
  if(!pool.length){toast('没有题目');return}
  Object.assign(E,{running:true,pool,i:0,pick:{},total:pool.length,sec:'',submitted:false});
  E.left=Math.ceil(pool.length*45);
  clearInterval(E.timer);
  E.timer=setInterval(()=>{
    if(!E.running){clearInterval(E.timer);return}
    E.left--;
    const el=document.getElementById('eClock');
    if(el)el.textContent=fmtTime(Math.max(0,E.left));
    if(E.left<=0){clearInterval(E.timer);submitExam(true)}
  },1000);
  renderExam();
}
function renderExam(){
  if(E.submitted)return;
  const q=E.pool[E.i];
  const answeredN=Object.keys(E.pick).length;
  app.innerHTML=`
  <div class="bar">
    <span class="chip" id="eClock">${fmtTime(Math.max(0,E.left))}</span>
    <span class="chip gray">已答 ${answeredN} / ${E.total}</span>
    <div class="spacer"></div>
    <button class="btn sm primary" id="eSubmit">交卷</button>
  </div>
  <div class="prog"><i style="width:${(E.i+1)/E.total*100}%"></i></div>
  <div class="card">
    <div class="qmeta"><span class="chip">第 ${E.i+1} 题</span><span class="chip gray">${q.t}</span><span class="chip gray">原第 ${q.o} 题</span></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts" id="eOpts">
      ${q.p.map(([k,t])=>`<button class="opt ${E.pick[q.id]===k?'sel':''}" data-k="${k}"><span class="k">${k}</span><span class="t">${esc(t)}</span></button>`).join('')}
    </div>
    <div class="row end">
      <button class="btn" id="ePrev" ${E.i===0?'disabled':''}>← 上一题</button>
      <button class="btn primary" id="eNext">${E.i===E.total-1?'检查并交卷':'下一题 →'}</button>
    </div>
  </div>
  <div class="card" style="padding:14px">
    <div class="mini" style="margin-bottom:2px">答题卡（点击跳转）</div>
    <div class="pal" id="ePal">
      ${E.pool.map((x,idx)=>`<button class="${E.pick[x.id]?'done':''} ${idx===E.i?'cur':''}" data-i="${idx}">${idx+1}</button>`).join('')}
    </div>
  </div>`;
  document.querySelectorAll('#eOpts .opt').forEach(b=>b.onclick=()=>{E.pick[q.id]=b.dataset.k;renderExam()});
  document.getElementById('ePrev').onclick=()=>{if(E.i>0){E.i--;renderExam()}};
  document.getElementById('eNext').onclick=()=>{
    if(E.i<E.total-1){E.i++;renderExam()}
    else{
      const un=E.total-Object.keys(E.pick).length;
      if(un&&!confirm(`还有 ${un} 题未作答，确定交卷？`))return;
      submitExam(false);
    }
  };
  document.getElementById('eSubmit').onclick=()=>{
    const un=E.total-Object.keys(E.pick).length;
    if(un&&!confirm(`还有 ${un} 题未作答，确定交卷？`))return;
    submitExam(false);
  };
  document.querySelectorAll('#ePal button').forEach(b=>b.onclick=()=>{E.i=+b.dataset.i;renderExam()});
}
function submitExam(auto){
  clearInterval(E.timer);
  E.submitted=true;E.running=false;
  let r=0,w=0,un=0;
  E.pool.forEach(q=>{
    const p=E.pick[q.id];
    if(!p){un++;markWrong(q.id)}
    else if(p===q.a){r++}
    else{w++;markWrong(q.id)}
  });
  const acc=Math.round(r/E.total*100);
  DB.examHist.push({t:Date.now(),n:E.total,r:r,acc:acc});
  if(DB.examHist.length>30)DB.examHist=DB.examHist.slice(-30);
  save();refreshHeader();
  const used=E.total*45-Math.max(0,E.left);
  app.innerHTML=`
  <div class="card">
    <div class="rslt">
      <div class="big" style="color:${acc>=80?'var(--ok)':acc>=60?'var(--warn)':'var(--bad)'}">${acc}<span style="font-size:22px">分</span></div>
      <div class="txt">${acc>=90?'优秀，可以去考试了 🎉':acc>=80?'不错，把错题再过一遍':acc>=60?'及格线附近，建议重点复习错题':'基础还不牢，先回速记模式背一轮'}${auto?' · 时间到自动交卷':''}</div>
    </div>
    <div style="margin-top:18px">
      <div class="kv"><span class="k">答对</span><span class="v" style="color:var(--ok)">${r}</span></div>
      <div class="kv"><span class="k">答错</span><span class="v" style="color:var(--bad)">${w}</span></div>
      <div class="kv"><span class="k">未作答</span><span class="v">${un}</span></div>
      <div class="kv"><span class="k">用时</span><span class="v">${fmtTime(used)}</span></div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn primary" id="eAgain">再考一次</button>
      <button class="btn" id="eToWrong">去错题复习 (${wrongIds().length})</button>
    </div>
  </div>
  <div class="card">
    <div class="qmeta"><span class="chip">逐题解析</span><span class="chip ${w+un?'bad':'ok'}">${w+un?'错 '+w+un+' 题':'全对'}</span></div>
    ${E.pool.map((q,idx)=>{
      const p=E.pick[q.id],ok=p===q.a;
      return `<div class="item" style="box-shadow:none;margin-bottom:10px">
        <div class="h"><span class="chip ${ok?'ok':'bad'}">${idx+1}</span><span>${q.t}</span><span class="chip gray">原第 ${q.o} 题</span></div>
        <div class="qt">${esc(q.q)}</div>
        <div class="ansline"><span class="lab">你的答案</span>${p?`<span class="${ok?'v-ok':'v-bad'}">${p}. ${esc((q.p.find(x=>x[0]===p)||['','(无)'])[1])}</span>`:'<span class="v-bad">未作答</span>'}</div>
        <div class="ansline"><span class="lab">正确答案</span><span class="v-ok">${q.a}. ${esc((q.p.find(x=>x[0]===q.a)||['',''])[1])}</span></div>
        <div class="ansline" style="margin-top:6px;color:var(--sub)"><span class="lab">解析</span>${esc(q.e)}</div>
      </div>`;
    }).join('')}
  </div>`;
  document.getElementById('eAgain').onclick=()=>renderExamStart();
  document.getElementById('eToWrong').onclick=()=>switchTab('wrong');
}

/* ---------------- 错题复习 ---------------- */
function renderWrong(){
  const ids=wrongIds();
  const list=ids.map(id=>byId(id));
  if(!list.length){
    app.innerHTML=`<div class="card empty"><div class="e">✅</div><div style="font-size:16px;font-weight:650;color:var(--ink)">错题本是空的</div><div class="mini" style="margin-top:6px">刷题或考试中答错的题会自动收进来</div>

    document.getElementById('wGo').onclick=()=>switchTab('practice');
    return;
  }
  app.innerHTML=`
  <div class="bar">
    <span class="chip bad">错题 ${list.length} 题</span>
    <div class="spacer"></div>
    <button class="btn sm primary" id="wStart">开始复习</button>
    <button class="btn sm ghost" id="wClear">清空</button>
  </div>
  <div class="mini" style="margin:10px 0 4px">复习模式下答对即自动移出错题本</div>
  ${list.map(q=>{
    const w=DB.wrong[q.id]||{c:0,t:0};
    return `<div class="item">
      <div class="h"><span class="chip bad">${q.id}</span><span>${q.t}</span><span class="chip gray">${esc(q.s)}</span><span class="chip gray">错 ${w.c} 次</span></div>
      <div class="qt">${esc(q.q)}</div>
      <div class="ansline"><span class="lab">正确答案</span><span class="v-ok">${q.a}. ${esc((q.p.find(x=>x[0]===q.a)||['',''])[1])}</span></div>
      <div class="ansline" style="margin-top:4px;color:var(--sub)"><span class="lab">解析</span>${esc(q.e)}</div>
      <div class="row" style="margin-top:10px"><button class="btn sm ghost" data-del="${q.id}">已掌握，移除</button></div>
    </div>`;
  }).join('')}`;
  document.getElementById('wStart').onclick=()=>{
    P.onlyWrong=true;P.order='shuffle';P.sec='';
    startPractice(shuffle(list));
  };
  document.getElementById('wClear').onclick=()=>{
    if(!confirm('确定清空全部错题记录？'))return;
    DB.wrong={};save();refreshHeader();renderWrong();
  };
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    delete DB.wrong[b.dataset.del];
    if(!DB.mastered[b.dataset.del])DB.mastered[b.dataset.del]=1;
    save();refreshHeader();renderWrong();
  });
}

/* ---------------- 路由 ---------------- */
function render(){
  refreshHeader();
  if(TAB==='memo')renderMemo();
  else if(TAB==='practice')P.running?renderPractice():renderPracticeStart();
  else if(TAB==='exam')E.submitted?null:(E.running?renderExam():renderExamStart());
  else if(TAB==='brand')renderBrand();
  else if(TAB==='jersey')renderJersey();
  else renderWrong();
}
function switchTab(t){
  if(TAB==='exam'&&E.running&&t!=='exam'&&!E.submitted){
    if(!confirm('考试进行中，离开将放弃本次考试，确定？'))return;
    clearInterval(E.timer);E.running=false;
  }
  TAB=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  window.scrollTo({top:0,behavior:'instant'});
  if(t==='memo')renderMemo();
  else if(t==='practice')renderPracticeStart();
  else if(t==='exam')renderExamStart();
  else if(t==='brand')renderBrand();
  else if(t==='jersey')renderJersey();
  else renderWrong();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  if(b.dataset.tab===TAB)return;
  switchTab(b.dataset.tab);
});

/* 键盘 */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
  const k=e.key.toUpperCase();
  if(TAB==='memo'){
    if(e.key==='ArrowLeft'){document.getElementById('mPrev')?.click()}
    else if(e.key==='ArrowRight'){document.getElementById('mNext')?.click()}
    else if(e.key===' '){e.preventDefault();document.getElementById('mReveal')?.click()}
    else if(/^[1-4]$/.test(e.key)){
      const q=M.list[M.i];if(!q)return;
      const opt=q.p[+e.key-1];if(!opt)return;
      ansDrill(opt[0]);
    }
  }else if(TAB==='practice'&&P.running&&!P.done){
    if(e.key==='ArrowLeft'){return}
    if(e.key==='Enter'||e.key==='ArrowRight'){document.getElementById('pNext')?.click();return}
    if(/^[1-4]$/.test(e.key)){
      const q=P.pool[P.i];const opt=q&&q.p[+e.key-1];if(opt)answerPractice(opt[0]);
    }
  }else if(TAB==='exam'&&E.running){
    if(/^[1-4]$/.test(e.key)){
      const q=E.pool[E.i];const opt=q&&q.p[+e.key-1];
      if(opt&&!E.submitted){E.pick[q.id]=opt[0];renderExam()}
    }else if(e.key==='ArrowRight'){document.getElementById('eNext')?.click()}
    else if(e.key==='ArrowLeft'){document.getElementById('ePrev')?.click()}
  }
});

}
